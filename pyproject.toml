[project]
name = "pawride-backend"
version = "0.1.0"
description = "PawRide backend API for dog rideshare role-based iOS app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.4.0",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
